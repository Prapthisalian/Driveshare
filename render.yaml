# Staging Blueprint. Review the paid resources before applying it in Render.
services:
  - type: web
    name: driveshare-staging-api
    runtime: node
    branch: codex/online-deployment
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build -w apps/api
    preDeployCommand: node --import tsx apps/api/prisma/hosted-database.ts && npm run db:migrate
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    disk:
      name: driveshare-staging-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'false'
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: driveshare-staging-db
          property: connectionString
      - key: DRIVESHARE_UPLOAD_DIR
        value: /var/data/uploads

databases:
  - name: driveshare-staging-db
    databaseName: driveshare_online
    user: driveshare_online
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    ipAllowList: []
